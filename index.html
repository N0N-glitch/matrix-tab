<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080d09">
    <title>Matrix Tab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fundo animado Matrix -->
    <canvas id="matrix-canvas" aria-hidden="true"></canvas>
    <div class="overlay" aria-hidden="true"></div>

    <!-- Botão para abrir o terminal -->
    <button
        id="toggle-terminal-btn"
        class="top-terminal-btn"
        type="button"
        aria-label="Abrir ou fechar terminal"
        title="Abrir Terminal"
    >
        <span aria-hidden="true">&gt;_</span>
        <span class="terminal-button-label">Terminal</span>
    </button>

    <!-- Conteúdo principal -->
    <main class="container">

        <!-- Relógio -->
        <section class="clock-section">
            <p class="clock-label">SYSTEM LOCAL TIME</p>
            <h1 id="clock">00:00:00</h1>
            <p id="date">Carregando data...</p>
        </section>

        <!-- Pesquisa -->
        <section class="search-section">
            <form id="search-form" role="search">
                <span class="search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m16 16 4 4"></path>
                    </svg>
                </span>

                <input
                    type="text"
                    id="search-input"
                    placeholder="Pesquisar na web ou escrever um endereço..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Pesquisar na web ou abrir um endereço"
                >

                <button type="submit" aria-label="Pesquisar">
                    <span>ENTER</span>
                    <span aria-hidden="true">↵</span>
                </button>
            </form>

            <p class="search-hint">PESQUISA RÁPIDA · GOOGLE</p>
        </section>

        <!-- Atalhos -->
        <section class="shortcuts-container">
            <div class="section-heading">
                <span>QUICK ACCESS</span>
                <span class="section-line"></span>
            </div>

            <div class="shortcuts" id="shortcuts-grid">
                <!-- Os atalhos são criados pelo JavaScript -->
            </div>

            <button
                id="add-shortcut-btn"
                class="add-shortcut-btn"
                type="button"
            >
                <span aria-hidden="true">+</span>
                Adicionar atalho
            </button>
        </section>

        <footer class="page-footer">
            <span class="status-indicator"></span>
            MATRIX SYSTEM ONLINE
        </footer>

    </main>

    <!-- Terminal -->
    <section
        class="terminal hidden"
        id="draggable-terminal"
        aria-label="Terminal Matrix"
    >
        <div class="terminal-header" id="terminal-drag-handle">

            <div class="window-controls">
                <button
                    class="dot red"
                    id="btn-close"
                    type="button"
                    aria-label="Fechar terminal"
                    title="Fechar"
                ></button>

                <button
                    class="dot yellow"
                    id="btn-minimize"
                    type="button"
                    aria-label="Minimizar terminal"
                    title="Minimizar"
                ></button>

                <button
                    class="dot green"
                    id="btn-expand"
                    type="button"
                    aria-label="Expandir ou restaurar terminal"
                    title="Expandir"
                ></button>
            </div>

            <span class="terminal-title">
                <span class="terminal-title-icon">&gt;_</span>
                MATRIX TERMINAL
            </span>

            <span class="terminal-version">v1.0.0</span>
        </div>

        <div class="terminal-content-wrapper" id="terminal-content-wrapper">

            <div class="terminal-body" id="terminal-output" aria-live="polite">
                <p class="system-msg">Matrix OS v1.0.0 (x86_64-pc-browser)</p>
                <p class="system-msg">
                    Digite <span class="highlight">help</span> para ver os comandos disponíveis.
                </p>
                <br>
            </div>

            <div class="terminal-input-line">
                <span class="prompt">user@matrix-tab:~$</span>

                <input
                    type="text"
                    id="terminal-input"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Comando do terminal"
                >
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
