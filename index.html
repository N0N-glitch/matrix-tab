
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="theme-color" content="#080d09">
    <meta
        name="description"
        content="Matrix Tab - A refined Matrix-inspired new tab experience."
    >
    <title>Matrix Tab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix-canvas" aria-hidden="true"></canvas>
    <div class="background-overlay" aria-hidden="true"></div>

    <header class="top-bar">
        <button
            id="toggle-terminal-btn"
            class="terminal-launcher"
            type="button"
            aria-label="Open terminal"
            title="Open terminal"
        >
            <span class="terminal-symbol">&gt;_</span>
            <span class="terminal-button-label">Terminal</span>
        </button>

        <div class="top-brand" aria-label="Matrix Tab">
            <span class="brand-mark">M</span>
            <span>MATRIX <small>TAB</small></span>
        </div>

        <div class="system-status">
            <span class="status-dot"></span>
            <span id="mode-label">SYSTEM ONLINE</span>
        </div>
    </header>

    <main class="main-content" id="main-content">
        <section class="welcome-section">
            <p class="eyebrow" id="welcome-label">WELCOME BACK</p>

            <h1 id="clock">00:00:00</h1>
            <p id="date" class="date-text">Loading date...</p>

            <div
                class="normal-wordmark"
                id="normal-wordmark"
                aria-hidden="true"
            >
                MATRIX
            </div>
        </section>

        <section class="search-section">
            <form id="search-form" role="search">
                <span class="search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m16 16 4 4"></path>
                    </svg>
                </span>

                <input
                    id="search-input"
                    type="text"
                    placeholder="Search the web or enter a URL"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Search the web or enter a URL"
                >

                <button
                    id="voice-search-btn"
                    class="voice-search-btn"
                    type="button"
                    aria-label="Voice search"
                    title="Voice search"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="9" y="3" width="6" height="12" rx="3"></rect>
                        <path d="M5 11a7 7 0 0 0 14 0"></path>
                        <path d="M12 18v3M9 21h6"></path>
                    </svg>
                </button>

                <button class="search-submit" type="submit" aria-label="Search">
                    <span>SEARCH</span>
                    <span aria-hidden="true">↵</span>
                </button>
            </form>

            <p class="search-caption">POWERED BY GOOGLE</p>
        </section>

        <section class="shortcuts-section">
            <div class="section-heading">
                <div>
                    <span class="section-kicker">YOUR SPACE</span>
                    <h2>Quick access</h2>
                </div>

                <span class="shortcut-count" id="shortcut-count">
                    04 SITES
                </span>
            </div>

            <div
                class="shortcuts-grid"
                id="shortcuts-grid"
                aria-live="polite"
            ></div>

            <div class="shortcut-controls">
                <button
                    id="add-shortcut-btn"
                    class="add-shortcut-btn"
                    type="button"
                >
                    <span class="add-icon">+</span>
                    <span>Add shortcut</span>
                </button>

                <nav class="pagination" aria-label="Shortcut pages">
                    <button
                        id="prev-page-btn"
                        class="page-arrow"
                        type="button"
                        aria-label="Previous page"
                        title="Previous page"
                    >
                        ‹
                    </button>

                    <div
                        class="page-dots"
                        id="page-dots"
                        aria-label="Page indicators"
                    ></div>

                    <button
                        id="next-page-btn"
                        class="page-arrow"
                        type="button"
                        aria-label="Next page"
                        title="Next page"
                    >
                        ›
                    </button>
                </nav>
            </div>
        </section>

        <footer class="page-footer">
            <span class="footer-line"></span>
            <span>THE MATRIX HAS YOU</span>
            <span class="footer-line"></span>
        </footer>
    </main>

    <section
        class="terminal hidden"
        id="draggable-terminal"
        aria-label="Matrix terminal"
    >
        <div class="terminal-header" id="terminal-drag-handle">
            <div class="window-controls">
                <button
                    class="dot red"
                    id="btn-close"
                    type="button"
                    aria-label="Close terminal"
                    title="Close"
                ></button>

                <button
                    class="dot yellow"
                    id="btn-minimize"
                    type="button"
                    aria-label="Minimize terminal"
                    title="Minimize"
                ></button>

                <button
                    class="dot green"
                    id="btn-expand"
                    type="button"
                    aria-label="Expand or restore terminal"
                    title="Expand"
                ></button>
            </div>

            <span class="terminal-title">
                <span class="terminal-title-icon">&gt;_</span>
                MATRIX TERMINAL
            </span>

            <span class="terminal-version">v2.0.0</span>
        </div>

        <div
            class="terminal-content-wrapper"
            id="terminal-content-wrapper"
        >
            <div
                class="terminal-body"
                id="terminal-output"
                aria-live="polite"
            >
                <p class="system-msg">Matrix Tab v2.0.0</p>
                <p class="system-msg">
                    Type <span class="highlight">help</span> to see available commands.
                </p>
                <br>
            </div>

            <div class="terminal-input-line">
                <span class="prompt">user@matrix-tab:~$</span>
                <input
                    type="text"
                    id="terminal-input"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Terminal command"
                >
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
